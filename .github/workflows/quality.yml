name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BROWSER_BOOTSTRAP: url
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install development tools
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --global typescript@5.8.3
          python -m playwright install --with-deps chromium
      - name: Check repository, code and real browser
        run: make check
      - name: Show formatting differences on failure
        if: failure()
        run: python -m ruff format --diff .
      - name: Publish diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
